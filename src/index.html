<!DOCTYPE html>
<html class="preload" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta http-equiv="X-UA-Compatibility" content="IE=Edge">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Jellyfin">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">

    <meta id="themeColor" name="theme-color" content="#202020">

    <link rel="apple-touch-icon" sizes="180x180" href="../node_modules/@jellyfin/ux-web/favicons/touchicon.png">
    <link rel="shortcut icon" href="../node_modules/@jellyfin/ux-web/favicons/favicon.ico">
    <meta name="msapplication-TileImage" content="../node_modules/@jellyfin/ux-web/favicons/touchicon144.png">
    <meta name="msapplication-TileColor" content="#333333">

    <title>Jellyfin</title>

    <style>
        .transparentDocument,
        .backgroundContainer-transparent:not(.withBackdrop) {
            background: none !important;
            background-color: transparent !important;
        }

        .layout-tv .mouseIdle,
        .layout-tv .mouseIdle button,
        .layout-tv .mouseIdle select,
        .layout-tv .mouseIdle input,
        .layout-tv .mouseIdle textarea,
        .layout-tv .mouseIdle a,
        .layout-tv .mouseIdle label,
        .transparentDocument .mouseIdle,
        .transparentDocument .mouseIdle button,
        .transparentDocument .mouseIdle select,
        .transparentDocument .mouseIdle input,
        .transparentDocument .mouseIdle textarea,
        .transparentDocument .mouseIdle a,
        .transparentDocument .mouseIdle label,
        .screensaver-noScroll.mouseIdle,
        .screensaver-noScroll.mouseIdle button,
        .screensaver-noScroll.mouseIdle select,
        .screensaver-noScroll.mouseIdle input,
        .screensaver-noScroll.mouseIdle textarea,
        .screensaver-noScroll.mouseIdle a,
        .screensaver-noScroll.mouseIdle label {
            cursor: none !important;
        }

        .preload {
            background-color: #101010;
        }

        .hide,
        .layout-desktop .hide-desktop,
        .layout-mobile .hide-mobile,
        .layout-tv .hide-tv,
        .mouseIdle .hide-mouse-idle,
        .mouseIdle-tv .hide-mouse-idle-tv {
            display: none !important;
        }

        .mainDrawerHandle {
            position: fixed;
            top: 0;
            bottom: 0;
            z-index: 1;
            width: 0.8em;
            padding-left: env(safe-area-inset-left);
            caret-color: transparent;
        }

        [dir="ltr"] .mainDrawerHandle {
            left: 0;
        }

        [dir="rtl"] .mainDrawerHandle {
            left: 0;
        }

        .bootError {
            position: fixed;
            z-index: 99999;
            right: 4vw;
            bottom: 4vw;
            left: 4vw;
            max-height: 70vh;
            overflow: auto;
            border: 2px solid #00a4dc;
            background: #101010;
            color: #fff;
            padding: 1.2rem;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;
            line-height: 1.4;
            box-shadow: 0 0 24px rgba(0, 164, 220, 0.6);
        }

        .bootErrorTitle {
            margin-bottom: 0.7rem;
            color: #00e5ff;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .bootErrorDetails {
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
    <script>
        (function () {
            var bootCompleted = false;
            var bootErrorShown = false;

            function toText(value) {
                if (value === undefined || value === null) {
                    return '';
                }

                if (value && value.stack) {
                    return String(value.stack);
                }

                if (value && value.message) {
                    return String(value.message);
                }

                return String(value);
            }

            function appendWhenReady(node) {
                if (document.body) {
                    document.body.appendChild(node);
                    return;
                }

                window.addEventListener('DOMContentLoaded', function () {
                    document.body.appendChild(node);
                });
            }

            function showBootError(title, details) {
                if (bootCompleted || bootErrorShown) {
                    return;
                }

                bootErrorShown = true;

                var panel = document.createElement('div');
                panel.className = 'bootError';
                panel.setAttribute('role', 'alert');

                var titleNode = document.createElement('div');
                titleNode.className = 'bootErrorTitle';
                titleNode.appendChild(document.createTextNode(title));

                var detailsNode = document.createElement('div');
                detailsNode.className = 'bootErrorDetails';
                detailsNode.appendChild(document.createTextNode(details));

                panel.appendChild(titleNode);
                panel.appendChild(detailsNode);
                appendWhenReady(panel);
            }

            window.__jellyfinBootCompleted = function () {
                bootCompleted = true;
            };

            window.onerror = function (message, source, lineno, colno, error) {
                showBootError('Jellyfin boot error', [
                    toText(message),
                    source ? 'Source: ' + source : '',
                    lineno ? 'Line: ' + lineno + (colno ? ':' + colno : '') : '',
                    error ? toText(error) : '',
                    'User agent: ' + navigator.userAgent
                ].join('\n'));
            };

            window.onunhandledrejection = function (event) {
                showBootError('Jellyfin boot promise rejection', [
                    toText(event && event.reason),
                    'User agent: ' + navigator.userAgent
                ].join('\n'));
            };

            window.addEventListener('error', function (event) {
                var target = event.target || event.srcElement;
                var failedAsset = target && target !== window && (target.src || target.href);

                if (failedAsset) {
                    showBootError('Jellyfin boot asset failed', [
                        failedAsset,
                        'User agent: ' + navigator.userAgent
                    ].join('\n'));
                }
            }, true);

            window.setTimeout(function () {
                var root = document.getElementById('reactRoot');
                var splash = root && root.querySelector('.splashLogo');

                if (!bootCompleted && splash) {
                    showBootError('Jellyfin boot stalled', [
                        'The startup splash was still visible after 15 seconds.',
                        'This usually means an older cached page is missing a script, or the TV web runtime rejected a startup script.',
                        'User agent: ' + navigator.userAgent
                    ].join('\n'));
                }
            }, 15000);
        }());
    </script>
</head>
<body dir="ltr">
    <div id="reactRoot">
        <div class="splashLogo"></div>
    </div>
</body>
</html>
